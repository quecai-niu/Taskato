<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Taskato 方案一设计对比</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #e9ecf4; background: #080a10; font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif; }
    header { height: 48px; display: flex; align-items: center; justify-content: space-around; border-bottom: 1px solid #303646; color: #b8c0d1; font-size: 14px; font-weight: 700; }
    main { width: 100vw; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1px; background: #303646; }
    figure { margin: 0; min-width: 0; overflow: hidden; background: #0d0f17; }
    img { display: block; width: 100%; max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <header><span>设计基准：方案一</span><span>正式实现：浏览器预览</span></header>
  <main>
    <figure><img src="source-normalized.png" alt="方案一设计基准"></figure>
    <figure><img src="implementation-normalized.png" alt="正式实现"></figure>
  </main>
</body>
</html>
